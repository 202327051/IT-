<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資格学習アプリ</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
        .hidden { display: none; }
        button { margin: 5px; padding: 8px 15px; cursor: pointer; }
        input[type="text"], input[type="password"] { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        .choice-btn { display: block; width: 100%; text-align: left; margin: 5px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>資格試験学習システム</h1>

    <!-- ログイン・会員登録エリア -->
    <div id="auth-section" class="card">
        <h2>ログイン / ユーザー登録</h2>
        <input type="text" id="username" placeholder="ユーザー名">
        <input type="password" id="password" placeholder="パスワード">
        <button onclick="login()">ログイン</button>
        <button onclick="register()">新規登録</button>
        <p id="auth-msg" style="color: red;"></p>
    </div>

    <!-- メイン操作エリア（ログイン後表示） -->
    <div id="main-section" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="user-display"></span>
            <button onclick="logout()">ログアウト</button>
        </div>
        <hr>

        <!-- 試験選択 -->
        <h3>1. 試験・資格の選択</h3>
        <div id="exam-list"></div>

        <!-- モード選択（選択式 / 記述式） -->
        <div id="mode-section" class="hidden">
            <h3>2. 学習モード選択</h3>
            <div id="mode-list"></div>
        </div>

        <!-- 問題解答エリア -->
        <div id="quiz-section" class="hidden" style="margin-top: 20px;">
            <hr>
            <h3 id="quiz-genre"></h3>
            <p id="quiz-question" style="font-size: 1.1em; font-weight: bold;"></p>
            
            <div id="choices-area"></div>
            
            <div id="descriptive-area" class="hidden">
                <textarea id="descriptive-answer" rows="4" style="width: 100%;" placeholder="解答を入力してください"></textarea>
                <br>
                <button onclick="submitDescriptiveAnswer()">回答を送信</button>
            </div>

            <!-- 解答結果・解説エリア -->
            <div id="result-area" class="hidden" style="margin-top: 15px; background: #f9f9f9; padding: 10px; border-radius: 5px;">
                <h4 id="result-judge"></h4>
                <p id="result-correct"></p>
                <p id="result-explanation"></p>
                <button onclick="nextQuestion()">次の問題へ</button>
                <button onclick="finishSession()">学習を終了して結果を見る</button>
            </div>
        </div>

        <!-- 最終結果 ＆ グラフ表示エリア -->
        <div id="stats-section" class="hidden" style="margin-top: 20px;">
            <hr>
            <h2>今回の学習結果</h2>
            <p id="stats-summary" style="font-size: 1.2em; font-weight: bold;"></p>
            
            <div id="genre-stats-table"></div>

            <h3>資格別 成績推移グラフ</h3>
            <div id="graph-area">
                <img id="graph-img" src="" alt="成績グラフ" style="max-width: 100%; display: none;">
                <p id="graph-msg"></p>
            </div>
            
            <button onclick="restart()">トップに戻る</button>
        </div>

        <!-- ファイルアップロード ＆ テンプレート管理 -->
        <hr style="margin-top: 30px;">
        <h3>CSV問題データの管理</h3>
        <input type="file" id="csv-file" accept=".csv">
        <button onclick="uploadCSV()">CSVをアップロードして登録</button>
        
        <p style="margin-top: 10px;">
            <strong>テンプレートダウンロード:</strong>
            <button onclick="downloadTemplate('1')">選択式テンプレート</button>
            <button onclick="downloadTemplate('2')">記述式テンプレート</button>
        </p>
    </div>

    <script>
        let currentMode = "1";
        let selectedExam = "";
        let currentQuestionId = null;
        let sessionId = "";

        function generateSessionId() {
            return 'session_' + Math.random().toString(36).substr(2, 9);
        }

        async function register() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            const res = await fetch("/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            document.getElementById("auth-msg").innerText = data.message || data.error;
        }

        async function login() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            const res = await fetch("/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById("auth-section").classList.add("hidden");
                document.getElementById("main-section").classList.remove("hidden");
                document.getElementById("user-display").innerText = `ログイン中: ${u} 様`;
                loadExams();
            } else {
                document.getElementById("auth-msg").innerText = data.error;
            }
        }

        async function logout() {
            await fetch("/logout");
            location.reload();
        }

        async function loadExams() {
            const res = await fetch("/get_exams");
            const data = await res.json();
            const container = document.getElementById("exam-list");
            container.innerHTML = "";

            data.exams.forEach(item => {
                const btn = document.createElement("button");
                btn.innerText = item.name;
                btn.onclick = () => selectExam(item.name);
                container.appendChild(btn);

                if (item.can_delete) {
                    const delBtn = document.createElement("button");
                    delBtn.innerText = "削除";
                    delBtn.style.color = "red";
                    delBtn.onclick = () => deleteExam(item.name);
                    container.appendChild(delBtn);
                }
            });
        }

        async function deleteExam(examName) {
            if (!confirm(`「${examName}」の問題データを削除しますか？`)) return;
            await fetch("/delete_exam", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({exam_type: examName})
            });
            loadExams();
        }

        async function selectExam(examName) {
            selectedExam = examName;
            sessionId = generateSessionId();

            const res = await fetch("/get_available_modes", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({exam_type: selectedExam})
            });
            const data = await res.json();

            const container = document.getElementById("mode-list");
            container.innerHTML = "";
            data.modes.forEach(mode => {
                const btn = document.createElement("button");
                btn.innerText = mode === "1" ? "選択式問題" : "記述式問題";
                btn.onclick = () => startQuiz(mode);
                container.appendChild(btn);
            });

            document.getElementById("mode-section").classList.remove("hidden");
            document.getElementById("quiz-section").classList.add("hidden");
            document.getElementById("stats-section").classList.add("hidden");
        }

        function startQuiz(mode) {
            currentMode = mode;
            document.getElementById("quiz-section").classList.remove("hidden");
            document.getElementById("stats-section").classList.add("hidden");
            nextQuestion();
        }

        async function nextQuestion() {
            document.getElementById("result-area").classList.add("hidden");
            document.getElementById("descriptive-answer").value = "";

            const res = await fetch("/get_question", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mode: currentMode, exam_type: selectedExam, session_id: sessionId})
            });

            if (!res.ok) {
                alert("該当する問題がありません、または全て回答完了しました。");
                finishSession();
                return;
            }

            const data = await res.json();
            currentQuestionId = data.id;
            document.getElementById("quiz-genre").innerText = data.genre;
            document.getElementById("quiz-question").innerText = data.question;

            const choicesArea = document.getElementById("choices-area");
            const descArea = document.getElementById("descriptive-area");
            choicesArea.innerHTML = "";

            if (currentMode === "1") {
                choicesArea.classList.remove("hidden");
                descArea.classList.add("hidden");

                data.choices.forEach(choice => {
                    const btn = document.createElement("button");
                    btn.className = "choice-btn";
                    btn.innerText = choice;
                    btn.onclick = () => submitAnswer(choice.charAt(0));
                    choicesArea.appendChild(btn);
                });
            } else {
                choicesArea.classList.add("hidden");
                descArea.classList.remove("hidden");
            }
        }

        async function submitAnswer(userAns) {
            const res = await fetch("/check_answer", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    mode: currentMode,
                    id: currentQuestionId,
                    answer: userAns,
                    session_id: sessionId
                })
            });
            const data = await res.json();
            showResult(data);
        }

        function submitDescriptiveAnswer() {
            const ans = document.getElementById("descriptive-answer").value;
            if (!ans.trim()) return alert("解答を入力してください");
            submitAnswer(ans);
        }

        function showResult(data) {
            document.getElementById("result-area").classList.remove("hidden");
            const judgeElem = document.getElementById("result-judge");
            const correctElem = document.getElementById("result-correct");
            const expElem = document.getElementById("result-explanation");

            if (data.mode === "1") {
                judgeElem.innerText = data.score > 0 ? "⭕️ 正解！" : "❌ 不正解...";
                judgeElem.style.color = data.score > 0 ? "green" : "red";
                correctElem.innerText = `正解: ${data.correct}`;
                expElem.innerText = `解説: ${data.explanation}`;
            } else {
                judgeElem.innerText = `得点: ${data.score} / ${data.max}`;
                judgeElem.style.color = data.score === data.max ? "green" : "orange";
                correctElem.innerText = `模範解答: ${data.correct}`;
                expElem.innerText = `必須キーワード: ${data.keywords.join(", ")} (不足: ${data.miss.join(", ") || "なし"})`;
            }
        }

        async function finishSession() {
            document.getElementById("quiz-section").classList.add("hidden");
            document.getElementById("stats-section").classList.remove("hidden");

            // 1. 最終結果の取得（選択中の試験種別 exam_type も一緒に送信）
            const res = await fetch("/get_final_stats", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    session_id: sessionId,
                    exam_type: selectedExam
                })
            });
            const data = await res.json();

            document.getElementById("stats-summary").innerText = 
                `正解率: ${data.total_rate}% (${data.total_score} / ${data.total_max} 点)`;

            // ジャンル別成績テーブル表示
            const tableDiv = document.getElementById("genre-stats-table");
            if (data.genre_stats && data.genre_stats.length > 0) {
                let html = "<table><tr><th>ジャンル</th><th>正解数/問題数</th><th>正解率</th></tr>";
                data.genre_stats.forEach(g => {
                    html += `<tr><td>${g.ジャンル}</td><td>${g.s} / ${g.m}</td><td>${g.rate}%</td></tr>`;
                });
                html += "</table>";
                tableDiv.innerHTML = html;
            } else {
                tableDiv.innerHTML = "";
            }

            // 2. 資格別の成績グラフを取得・表示
            loadGraph();
        }

        async function loadGraph() {
            // 選択中の試験種別（selectedExam）をクエリパラメータに付与
            const res = await fetch(`/get_graph?exam_type=${encodeURIComponent(selectedExam)}`);
            const data = await res.json();

            const img = document.getElementById("graph-img");
            const msg = document.getElementById("graph-msg");

            if (data.plot) {
                img.src = "data:image/png;base64," + data.plot;
                img.style.display = "block";
                msg.innerText = "";
            } else {
                img.style.display = "none";
                msg.innerText = data.error || "グラフのデータがありません。";
            }
        }

        function restart() {
            document.getElementById("stats-section").classList.add("hidden");
            document.getElementById("mode-section").classList.add("hidden");
            loadExams();
        }

        async function uploadCSV() {
            const fileInput = document.getElementById("csv-file");
            if (!fileInput.files[0]) return alert("ファイルを選択してください");

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const res = await fetch("/upload_csv", {
                method: "POST",
                body: formData
            });
            const data = await res.json();

            if (res.ok) {
                alert(data.message);
                fileInput.value = "";
                loadExams();
            } else {
                alert(data.error);
            }
        }

        function downloadTemplate(modeType) {
            window.location.href = `/download_template/${modeType}`;
        }
    </script>
</body>
</html>
