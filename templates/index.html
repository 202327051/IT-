<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITパスポート学習ボット</title>
    <style>
        :root { --bg-color: #7494c0; --bot-bubble: #ffffff; --user-bubble: #85e249; }
        body, html { height: 100%; margin: 0; font-family: sans-serif; background: var(--bg-color); display: flex; flex-direction: column; }
        .header { background: #35495e; color: white; padding: 12px; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .bot { align-self: flex-start; background: var(--bot-bubble); color: black; border-top-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--user-bubble); color: black; border-top-right-radius: 2px; }
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        .auth-box { background: white; padding: 30px; border-radius: 15px; width: 80%; max-width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .auth-box input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .input-area-fixed { background: #f8f8f8; padding: 10px; border-top: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn-blue { background: #007bff; color: white; border: none; border-radius: 20px; padding: 8px 15px; font-weight: bold; }
        .btn-red { background: #dc3545; color: white; border: none; border-radius: 20px; padding: 8px 15px; font-weight: bold; }
        .btn-gray { background: #6c757d; color: white; border: none; border-radius: 20px; padding: 8px 15px; font-weight: bold; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 5px; }
    </style>
</head>
<body>
    <div id="auth-container">
        <h2 style="color: white;">ITパスポート学習ボット</h2>
        <div class="auth-box">
            <input type="text" id="username" placeholder="ユーザー名">
            <input type="password" id="password" placeholder="パスワード">
            <button onclick="auth('login')" class="btn-blue">ログイン</button>
            <button onclick="auth('register')" class="btn-gray">新規登録</button>
        </div>
    </div>

    <div id="main-app" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
        <div class="header">ITパスポート学習チャット <button onclick="logout()" class="btn-red" style="font-size: 10px; float: right;">退出</button></div>
        <div id="chat-box"></div>
        <div class="input-area-fixed">
            <div id="mode-select" class="controls">
                <button onclick="startApp('1')" class="btn-blue">過去問モード</button>
                <button onclick="startApp('2')" class="btn-blue">用語説明モード</button>
            </div>
            <div id="next-area" class="controls hidden">
                <button onclick="loadQuestion()" class="btn-blue">次の問題</button>
                <button onclick="finishApp()" id="finish-btn" class="btn-red">終了・集計</button>
            </div>
            <div id="menu-area" class="controls hidden">
                <button onclick="startApp('1')" class="btn-blue">再挑戦</button>
                <button onclick="showGraph()" class="btn-blue">成績グラフ</button>
            </div>
            <div class="input-bar" style="display: flex; gap: 5px;">
                <input type="text" id="user-input" style="flex:1; border-radius:20px; padding:8px;" placeholder="答えを入力...">
                <button onclick="sendMessage()" class="btn-blue">送信</button>
            </div>
        </div>
    </div>

    <script>
        let mode = "", qId = null, qCount = 0, isWaiting = false;

        async function auth(type) {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const res = await fetch('/' + type, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pass }) });
            const data = await res.json();
            if (res.ok) {
                document.getElementById("auth-container").classList.add("hidden");
                document.getElementById("main-app").classList.remove("hidden");
                addMsg("bot", "ログインしました。モードを選択してください。");
            } else { alert(data.error); }
        }

        async function logout() { await fetch('/logout'); location.reload(); }

        function addMsg(sender, text) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function startApp(m) { mode = m; qCount = 0; loadQuestion(); }

        async function loadQuestion() {
            qCount++; hideAll();
            const res = await fetch('/get_question', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mode: mode}) });
            const data = await res.json();
            qId = data.id; isWaiting = true;
            let text = `<b>Q${qCount}</b><br>${data.question}`;
            if(data.choices) text += `<br><br>${data.choices.join("<br>")}`;
            addMsg("bot", text);
        }

        function sendMessage() {
            const val = document.getElementById("user-input").value.trim();
            if(!val || !isWaiting) return;
            handleAnswer(val);
            document.getElementById("user-input").value = "";
        }

        async function handleAnswer(val) {
            isWaiting = false; addMsg("user", val); hideAll();
            const res = await fetch('/check_answer', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mode: mode, id: qId, answer: val}) });
            const data = await res.json();
            let fb = `<b>採点結果</b>: ${data.score}/${data.max}<br>`;
            if(mode === "2") {
                fb += `キーワード: ${data.keywords.join(", ")}<br>`;
                if(data.score < data.max) fb += `<span style="color:red">不足: ${data.miss.join(", ")}</span>`;
                else fb += `<span style="color:blue">✨完璧です！</span>`;
            } else {
                fb += data.score ? "⭕正解" : `❌不正解<br>正解: ${data.correct}`;
            }
            addMsg("bot", fb);
            document.getElementById("next-area").classList.remove("hidden");
            if(mode === "1") document.getElementById("finish-btn").classList.remove("hidden");
        }

        async function finishApp() {
            const res = await fetch('/get_final_stats');
            const data = await res.json();
            let h = `<b>結果</b>: ${data.total_rate}%<br><table><tr><th>ジャンル</th><th>率</th></tr>`;
            data.genre_stats.forEach(s => h += `<tr><td>${s.ジャンル}</td><td>${s.rate}%</td></tr>`);
            addMsg("bot", h + "</table>");
            hideAll(); document.getElementById("menu-area").classList.remove("hidden");
        }

        async function showGraph() {
            const res = await fetch('/get_graph');
            const data = await res.json();
            addMsg("bot", `<img src="data:image/png;base64,${data.plot}" style="width:100%;">`);
        }

        function hideAll() { ["mode-select", "next-area", "menu-area"].forEach(id => document.getElementById(id).classList.add("hidden")); }
    </script>
</body>
</html>
