<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITパスポート学習ボット</title>
    <style>
        :root { --bg-color: #7494c0; --bot-bubble: #ffffff; --user-bubble: #85e249; }
        body, html { height: 100%; margin: 0; font-family: sans-serif; background: var(--bg-color); display: flex; flex-direction: column; }
        .header { background: #35495e; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.5; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .bot { align-self: flex-start; background: var(--bot-bubble); color: black; border-top-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--user-bubble); color: black; border-top-right-radius: 2px; }
        .input-area-fixed { background: #f8f8f8; padding: 10px; border-top: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .input-bar { display: flex; gap: 8px; }
        input[type="text"], input[type="password"] { flex: 1; border: 1px solid #ccc; padding: 10px 15px; border-radius: 25px; font-size: 16px; outline: none; background: white; }
        button { border: none; border-radius: 20px; padding: 8px 15px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-blue { background: #007bff; color: white; }
        .btn-send { background: #28a745; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-gray { background: #6c757d; color: white; }
        .choice-btn { background: white; border: 1px solid #007bff; color: #007bff; padding: 8px 20px; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 5px; text-align: left; }
        #auth-screen { flex:1; display:flex; align-items:center; justify-content:center; }
        #auth-area { padding: 30px; display: flex; flex-direction: column; gap: 15px; background: white; border-radius: 15px; width: 80%; max-width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body onload="checkStatus()">
    <div class="header">
        <div style="width:50px;"></div> <span>ITパスポート学習チャット</span>
        <button id="logout-btn" onclick="logout()" class="btn-red hidden" style="font-size:10px; padding:5px 10px;">ログアウト</button>
    </div>
    
    <div id="auth-screen">
        <div id="auth-area">
            <h3 style="text-align:center; margin:0;">ログイン / 新規登録</h3>
            <input type="text" id="username" placeholder="ユーザー名">
            <input type="password" id="password" placeholder="パスワード">
            <button onclick="auth('login')" class="btn-blue">ログイン</button>
            <button onclick="auth('register')" class="btn-gray">新規登録</button>
        </div>
    </div>

    <div id="chat-screen" class="hidden" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div id="chat-box"></div>
        <div class="input-area-fixed">
            <div id="mode-select" class="controls">
                <button onclick="startApp('1')" class="btn-blue">過去問モード</button>
                <button onclick="startApp('2')" class="btn-blue">用語説明モード</button>
            </div>
            <div id="choice-area" class="controls hidden">
                <button class="choice-btn" onclick="handleAnswer('ア')">ア</button>
                <button class="choice-btn" onclick="handleAnswer('イ')">イ</button>
                <button class="choice-btn" onclick="handleAnswer('ウ')">ウ</button>
                <button class="choice-btn" onclick="handleAnswer('エ')">エ</button>
            </div>
            <div id="next-area" class="controls hidden">
                <button onclick="loadQuestion()" class="btn-blue">次の問題へ</button>
                <button id="finish-btn" onclick="finishApp()" class="btn-red">終了・集計</button>
            </div>
            <div id="menu-area" class="controls hidden">
                <button onclick="startApp('1')" class="btn-blue">再挑戦(過去問)</button>
                <button onclick="startApp('2')" class="btn-blue">再挑戦(用語)</button>
                <button onclick="showGraph()" class="btn-blue">成績グラフ</button>
                <button onclick="backToTop()" class="btn-gray">トップに戻る</button>
            </div>
            <div id="graph-menu" class="controls hidden">
                <button onclick="confirmReset()" class="btn-red">履歴リセット</button>
                <button onclick="backToTop()" class="btn-gray">戻る</button>
            </div>
            <div class="input-bar">
                <input type="text" id="user-input" placeholder="答えを入力..." onkeypress="if(event.keyCode==13) sendMessage()">
                <button onclick="sendMessage()" class="btn-send">送信</button>
            </div>
        </div>
    </div>

    <script>
        let mode = "", qId = null, qCount = 0, isWaitingForAnswer = false;
        let sessionId = ""; // 今回の挑戦を識別するためのID

        function checkStatus() {
            // ページ読み込み時にログイン画面を表示
            document.getElementById("auth-screen").classList.remove("hidden");
        }

        async function auth(type) {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            if(!u || !p) return alert("入力してください");

            const res = await fetch('/' + type, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();

            if(res.ok) {
                if(type === 'register') return auth('login'); // 登録後は自動ログイン
                document.getElementById("auth-screen").classList.add("hidden");
                document.getElementById("chat-screen").classList.remove("hidden");
                document.getElementById("logout-btn").classList.remove("hidden");
                initChat();
            } else { alert(data.error); }
        }

        async function logout() {
            await fetch('/logout');
            location.reload();
        }

        function addMsg(sender, text) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function initChat() { 
            isWaitingForAnswer = false;
            document.getElementById("chat-box").innerHTML = "";
            addMsg("bot", "ITパスポート学習ボットです。まずは下のボタンからモードを選んでください。"); 
        }

        function sendMessage() {
            const el = document.getElementById("user-input");
            const val = el.value.trim();
            if(!val) return;
            if(!isWaitingForAnswer) {
                addMsg("user", val);
                addMsg("bot", "モードを選択してください。");
                el.value = ""; return;
            }
            handleAnswer(val); el.value = "";
        }

        function startApp(m) {
            mode = m; qCount = 0;
            sessionId = Date.now().toString(); // 開始時に新しいセッションIDを生成
            hideAllControls();
            addMsg("bot", `<b>--- モード${m}を開始 ---</b>`);
            loadQuestion();
        }

        async function loadQuestion() {
            qCount++; hideAllControls();
            const res = await fetch('/get_question', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mode: mode}) });
            const data = await res.json();
            qId = data.id; isWaitingForAnswer = true;
            let text = `<b>Q${qCount}</b> [${data.genre}]<br>${data.question}`;
            if(data.choices) {
                let choiceTxt = data.choices.join("<br>");
                text += `<br><br>【選択肢】<br>${choiceTxt}`;
            }
            addMsg("bot", text);
            if (mode === "1") document.getElementById("choice-area").classList.remove("hidden");
        }

        async function handleAnswer(val) {
            isWaitingForAnswer = false; addMsg("user", val); hideAllControls();
            const res = await fetch('/check_answer', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mode: mode, id: qId, answer: val, session_id: sessionId}) });
            const data = await res.json();
            let fb = "";
            if (mode === "1") {
                fb = `<b>${data.score ? "⭕ 正解！" : "❌ 不正解..." }</b><br>正解: ${data.correct}<br><br>【解説】<br>${data.explanation}`;
            } else {
                fb = `<b>採点結果</b>: ${data.score}/${data.max}<br>キーワード: ${data.keywords.join(", ")}<br>`;
                fb += (data.miss && data.miss.length > 0) ? `<span style="color:red">不足: ${data.miss.join(", ")}</span>` : `<span style="color:blue">✨網羅しています！</span>`;
                fb += `<br><br><b>【模範解答】</b><br>${data.correct}`;
            }
            addMsg("bot", fb.replace(/\n/g, "<br>"));
            document.getElementById("next-area").classList.remove("hidden");
            if(mode === "1") document.getElementById("finish-btn").classList.remove("hidden");
        }

        async function finishApp() {
            hideAllControls();
            const res = await fetch('/get_final_stats', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({session_id: sessionId}) });
            const data = await res.json();
            let html = `<b>今回の成績</b>: ${data.total_rate}% (${data.total_score}/${data.total_max})<br><table><tr><th>ジャンル</th><th>率</th></tr>`;
            data.genre_stats.forEach(s => html += `<tr><td>${s.ジャンル}</td><td>${s.rate}%</td></tr>`);
            addMsg("bot", html + "</table>");
            document.getElementById("menu-area").classList.remove("hidden");
        }

        async function showGraph() {
            hideAllControls();
            const res = await fetch('/get_graph');
            const data = await res.json();
            if(data.error) return addMsg("bot", "データがありません。");
            addMsg("bot", `<b>成績推移</b><br><img src="data:image/png;base64,${data.plot}" style="width:100%;">`);
            document.getElementById("graph-menu").classList.remove("hidden");
        }

        function backToTop() { 
            hideAllControls(); 
            document.getElementById("mode-select").classList.remove("hidden"); 
            addMsg("bot", "モードを選んでください。");
        }

        function hideAllControls() { 
            ["mode-select", "choice-area", "next-area", "menu-area", "graph-menu"].forEach(id => {
                document.getElementById(id).classList.add("hidden");
            });
        }

        async function confirmReset() { 
            if(confirm("個人の全履歴をリセットしますか？")) { 
                await fetch('/reset_history', {method: 'POST'}); location.reload();
            } 
        }
    </script>
</body>
</html>
