<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITパスポート 学習チャット</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #7494c0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0; padding: 0;
    }
    .chat-container {
      max-width: 600px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #7494c0;
    }
    .chat-header {
      background-color: #2c3e50;
      color: white;
      padding: 12px 16px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }
    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .bot .bubble {
      background-color: #ffffff;
      color: #000000;
      border-top-left-radius: 2px;
    }
    .user .bubble {
      background-color: #85e249;
      color: #000000;
      border-top-right-radius: 2px;
    }
    .system-msg {
      align-self: center;
      background-color: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
      margin: 5px 0;
    }
    .chat-footer {
      background-color: #f0f0f0;
      padding: 10px;
      border-top: 1px solid #ccc;
    }
    .btn-choice {
      background-color: white;
      border: 1px solid #7494c0;
      color: #333;
      text-align: left;
      margin-bottom: 6px;
      border-radius: 10px;
      padding: 8px 12px;
      width: 100%;
    }
    .btn-choice:hover { background-color: #e6f0fa; }
    #progress-graph { max-width: 100%; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">ITパスポート 学習BOT</div>

  <div class="chat-body" id="chat-body">
    <div class="message bot">
      <div class="bubble">
        こんにちは！学習を開始するにはログインし、試験と出題形式を選択してください。
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <!-- 認証コントロール -->
    <div id="auth-section" class="mb-2">
      <div id="logged-out-view" class="input-group input-group-sm">
        <input type="text" id="username" class="form-control" placeholder="ユーザー名">
        <input type="password" id="password" class="form-control" placeholder="パスワード">
        <button class="btn btn-primary" onclick="login()">ログイン</button>
        <button class="btn btn-outline-primary" onclick="register()">登録</button>
      </div>
      <div id="logged-in-view" class="d-none d-flex justify-content-between align-items-center">
        <span id="user-display" class="fw-bold text-dark"></span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <!-- セットアップ（試験・形式選択） -->
    <div id="setup-section" class="mb-2">
      <div class="row g-1">
        <div class="col-6">
          <select id="exam-select" class="form-select form-select-sm" onchange="onExamChange()">
            <option value="">試験選択</option>
          </select>
        </div>
        <div class="col-6">
          <select id="mode-select" class="form-select form-select-sm" disabled>
            <option value="">形式選択</option>
          </select>
        </div>
      </div>
      <div class="d-flex gap-1 mt-2">
        <button id="start-btn" class="btn btn-success btn-sm flex-fill" onclick="startSession()" disabled>学習開始</button>
        <button id="template-btn" class="btn btn-outline-secondary btn-sm" onclick="downloadTemplate()" disabled>テンプレ</button>
        <label class="btn btn-outline-info btn-sm mb-0">
          CSV上書 <input type="file" id="csv-file" accept=".csv" style="display:none;" onchange="uploadCSV()">
        </label>
        <button id="delete-exam-btn" class="btn btn-outline-danger btn-sm d-none" onclick="deleteExam()">削除</button>
      </div>
    </div>

    <!-- 入力エリア -->
    <div id="input-section" class="d-none">
      <div id="choice-area"></div>
      <div id="text-area" class="d-none">
        <textarea id="user-text-ans" class="form-control form-control-sm mb-2" rows="3" placeholder="解答を入力してください..."></textarea>
        <button id="submit-ans-btn" class="btn btn-primary btn-sm w-100" onclick="submitTextAnswer()">送信する</button>
      </div>
      <button id="next-btn" class="btn btn-secondary btn-sm w-100 mt-2 d-none" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <!-- 終了時コントロール -->
    <div id="finish-controls" class="d-none d-flex gap-2 mt-2">
      <button onclick="startSession()" class="btn btn-secondary btn-sm flex-fill">もう一度解く</button>
      <button onclick="resetHistory()" class="btn btn-outline-danger btn-sm flex-fill">履歴リセット</button>
    </div>
  </div>
</div>

<script>
  marked.setOptions({ breaks: true, gfm: true });
  let currentSessionId = "", currentMode = "1", currentExam = "", questionCount = 0, currentQId = null;

  window.onload = function() { loadExams(); };

  async function apiCall(url, data = {}) {
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return await res.json();
    } catch (e) {
      return { error: "通信エラーが発生しました" };
    }
  }

  function appendMessage(sender, text, isMarkdown = false) {
    const body = document.getElementById("chat-body");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    
    if (isMarkdown) {
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.innerText = text;
    }
    
    msgDiv.appendChild(bubble);
    body.appendChild(msgDiv);
    body.scrollTop = body.scrollHeight;
  }

  function appendSystemMessage(text) {
    const body = document.getElementById("chat-body");
    const sysDiv = document.createElement("div");
    sysDiv.className = "system-msg";
    sysDiv.innerText = text;
    body.appendChild(sysDiv);
    body.scrollTop = body.scrollHeight;
  }

  async function login() {
    const u = document.getElementById('username').value, p = document.getElementById('password').value;
    const res = await apiCall('/login', { username: u, password: p });
    if (res.message) {
      document.getElementById('logged-out-view').classList.add('d-none');
      document.getElementById('logged-in-view').classList.remove('d-none');
      document.getElementById('user-display').innerText = u;
      appendSystemMessage(`ログイン完了: ${u}`);
      loadExams();
    } else { alert(res.error || "ログイン失敗"); }
  }

  async function register() {
    const u = document.getElementById('username').value, p = document.getElementById('password').value;
    const res = await apiCall('/register', { username: u, password: p });
    if (res.message) alert("登録完了！ログインしてください。"); else alert(res.error || "登録失敗");
  }

  async function logout() { await fetch('/logout'); location.reload(); }

  async function loadExams() {
    const res = await fetch('/get_exams').then(r => r.json());
    const select = document.getElementById('exam-select');
    select.innerHTML = '<option value="">試験選択</option>';
    if (res.exams) {
      res.exams.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.name; opt.innerText = e.name; opt.dataset.canDelete = e.can_delete;
        select.appendChild(opt);
      });
    }
  }

  async function onExamChange() {
    const select = document.getElementById('exam-select');
    currentExam = select.value;
    const delBtn = document.getElementById('delete-exam-btn'), startBtn = document.getElementById('start-btn');
    const templateBtn = document.getElementById('template-btn'), modeSelect = document.getElementById('mode-select');

    if (!currentExam) {
      delBtn.classList.add('d-none'); startBtn.disabled = true; templateBtn.disabled = true; modeSelect.disabled = true;
      modeSelect.innerHTML = '<option value="">形式選択</option>'; return;
    }

    const selectedOpt = select.options[select.selectedIndex];
    if (selectedOpt.dataset.canDelete === "true") delBtn.classList.remove('d-none'); else delBtn.classList.add('d-none');

    const res = await apiCall('/get_available_modes', { exam_type: currentExam });
    modeSelect.innerHTML = '';
    if (res.modes && res.modes.length > 0) {
      res.modes.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.innerText = m === "1" ? "選択式" : "記述式";
        modeSelect.appendChild(opt);
      });
      modeSelect.disabled = false; startBtn.disabled = false; templateBtn.disabled = false;
    } else {
      modeSelect.innerHTML = '<option value="">なし</option>';
      modeSelect.disabled = true; startBtn.disabled = true; templateBtn.disabled = true;
    }
  }

  function startSession() {
    currentMode = document.getElementById('mode-select').value;
    currentSessionId = "sess_" + Date.now(); questionCount = 0;
    document.getElementById('setup-section').classList.add('d-none');
    document.getElementById('finish-controls').classList.add('d-none');
    document.getElementById('input-section').classList.remove('d-none');
    appendSystemMessage(`【${currentExam}】学習をスタートします`);
    nextQuestion();
  }

  async function nextQuestion() {
    document.getElementById('next-btn').classList.add('d-none');
    document.getElementById('choice-area').innerHTML = '';
    document.getElementById('user-text-ans').value = '';

    const res = await apiCall('/get_question', { mode: currentMode, exam_type: currentExam, session_id: currentSessionId });
    if (res.error) {
      appendSystemMessage("すべての問題が終了しました！");
      finishSession();
      return;
    }

    currentQId = res.id;
    questionCount++;
    let genreText = (res.genre || '').replace(/\s*\|\s*(nan|none|null|undefined)$/i, '');
    appendMessage("bot", `【第 ${questionCount} 問 / ${genreText}】\n\n${res.question}`, true);

    const choiceArea = document.getElementById('choice-area'), textArea = document.getElementById('text-area');

    if (currentMode === "1") {
      choiceArea.classList.remove('d-none'); textArea.classList.add('d-none');
      res.choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-choice';
        btn.innerHTML = marked.parse(String(c).replace(/\\n/g, '\n'));
        btn.onclick = () => submitChoiceAnswer(res.id, c.charAt(0));
        choiceArea.appendChild(btn);
      });
    } else {
      choiceArea.classList.add('d-none'); textArea.classList.remove('d-none');
    }
  }

  async function submitChoiceAnswer(qId, ans) {
    appendMessage("user", ans);
    document.getElementById('choice-area').classList.add('d-none');

    const res = await apiCall('/check_answer', { mode: "1", id: qId, answer: ans, session_id: currentSessionId });

    const status = res.score > 0 ? "⭕ 正解！" : "❌ 不正解...";
    appendMessage("bot", `${status}\n正解: ${res.correct}\n\n解説:\n${res.explanation}`, true);
    document.getElementById('next-btn').classList.remove('d-none');
  }

  async function submitTextAnswer() {
    const userAns = document.getElementById('user-text-ans').value.trim();
    if (!userAns) return alert("回答を入力してください");

    appendMessage("user", userAns);
    document.getElementById('text-area').classList.add('d-none');

    const res = await apiCall('/check_answer', { mode: "2", id: currentQId, answer: userAns, session_id: currentSessionId });

    let fbText = `採点結果: ${res.score} / ${res.max} 点\n\n模範解答:\n${res.correct}`;
    if (res.feedback) fbText += `\n\n【判定詳細】\n${res.feedback}`;

    appendMessage("bot", fbText, true);
    document.getElementById('next-btn').classList.remove('d-none');
  }

  async function finishSession() {
    document.getElementById('input-section').classList.add('d-none');
    document.getElementById('setup-section').classList.remove('d-none');

    const res = await apiCall('/get_final_stats', { session_id: currentSessionId, exam_type: currentExam });

    let resultText = `🎉 成績発表 🎉\n正答率: ${res.total_rate}%\n(得点: ${res.total_score} / ${res.total_max} 点)`;
    appendMessage("bot", resultText);

    document.getElementById('finish-controls').classList.remove('d-none');

    // グラフ取得
    const graphRes = await apiCall('/get_graph', { exam_type: currentExam });
    if (graphRes.plot) {
      const body = document.getElementById("chat-body");
      const imgDiv = document.createElement("div");
      imgDiv.className = "message bot";
      imgDiv.innerHTML = `<div class="bubble"><strong>学習推移グラフ</strong><br><img src="data:image/png;base64,${graphRes.plot}" id="progress-graph"></div>`;
      body.appendChild(imgDiv);
      body.scrollTop = body.scrollHeight;
    }
  }

  function downloadTemplate() {
    const mode = document.getElementById('mode-select').value || "1";
    window.location.href = `/download_template/${mode}`;
  }

  async function uploadCSV() {
    const fileInput = document.getElementById('csv-file');
    if (!fileInput.files[0]) return;
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
      const res = await fetch('/upload_csv', { method: 'POST', body: formData }).then(r => r.json());
      if (res.message) { alert(res.message); loadExams(); } else alert(res.error || "アップロード失敗");
    } catch (e) { alert("通信エラーが発生しました"); }
    fileInput.value = "";
  }

  async function deleteExam() {
    if (!confirm(`「${currentExam}」を削除してもよろしいですか？`)) return;
    const res = await apiCall('/delete_exam', { exam_type: currentExam });
    alert(res.message); loadExams(); onExamChange();
  }

  async function resetHistory() {
    if (!confirm(`「${currentExam}」の学習履歴をリセットしますか？`)) return;
    await apiCall('/reset_history', { exam_type: currentExam });
    alert("履歴をリセットしました");
  }
</script>
</body>
</html>
